services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devhelp
      POSTGRES_PASSWORD: devhelp
      POSTGRES_DB: devhelp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devhelp -d devhelp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
