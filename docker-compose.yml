services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devhelp
      POSTGRES_PASSWORD: devhelp
      POSTGRES_DB: devhelp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devhelp -d devhelp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local email catcher: every email the platform sends lands here (UI on :8025).
  mail:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  # S3-compatible object storage for local development (Cloudflare R2 in production).
  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: devhelp
      MINIO_ROOT_PASSWORD: devhelp-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Creates the bucket once MinIO is up, then exits.
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://storage:9000 devhelp devhelp-minio && mc mb --ignore-existing local/devhelp"

volumes:
  postgres_data:
  minio_data:
