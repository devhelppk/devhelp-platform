services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devhelp
      POSTGRES_PASSWORD: devhelp
      POSTGRES_DB: devhelp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devhelp -d devhelp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local email catcher: every email the platform sends lands here (UI on :8025).
  mail:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  postgres_data:
