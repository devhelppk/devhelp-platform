name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devhelp
          POSTGRES_PASSWORD: devhelp
          POSTGRES_DB: devhelp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devhelp -d devhelp"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql://devhelp:devhelp@localhost:5432/devhelp
      EMAIL_PROVIDER: smtp
      SMTP_URL: smtp://localhost:1025
      MAILPIT_URL: http://localhost:8025
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: auto
      S3_BUCKET: devhelp
      S3_ACCESS_KEY_ID: devhelp
      S3_SECRET_ACCESS_KEY: devhelp-minio
      S3_FORCE_PATH_STYLE: "1"
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production-0000
      BETTER_AUTH_URL: http://localhost:3001
      CONTENT_SYNC_SECRET: ci-only-content-sync-secret
      # Required whenever NODE_ENV=production (next build / typegen); localhost is fine for CI.
      NEXT_PUBLIC_WEB_URL: http://localhost:3000
      NEXT_PUBLIC_LMS_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # MinIO needs a command, which service containers cannot set, so it runs
      # as a step. Same S3 API the platform uses against Cloudflare R2.
      - name: Object storage (MinIO)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=devhelp -e MINIO_ROOT_PASSWORD=devhelp-minio \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break || sleep 2
          done
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c "mc alias set ci http://localhost:9000 devhelp devhelp-minio && mc mb --ignore-existing ci/devhelp"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm content:pull
      - run: pnpm content:check
        env:
          VITEST_BIN: ${{ github.workspace }}/packages/content-schema/node_modules/.bin/vitest
      - run: pnpm db:migrate
      - run: pnpm content:sync
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build
      - name: Bundle budget (first-load JS on a production server)
        run: |
          (cd apps/lms && pnpm exec next start --port 3001 > /tmp/lms.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3001/ && break; sleep 1; done
          pnpm check-budget
