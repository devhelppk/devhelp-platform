name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: devhelp
          POSTGRES_PASSWORD: devhelp
          POSTGRES_DB: devhelp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devhelp -d devhelp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://devhelp:devhelp@localhost:5432/devhelp
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production-0000
      BETTER_AUTH_URL: http://localhost:3001
      CONTENT_SYNC_SECRET: ci-only-content-sync-secret
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm content:pull
      - run: pnpm content:check
        env:
          VITEST_BIN: ${{ github.workspace }}/packages/content-schema/node_modules/.bin/vitest
      - run: pnpm db:migrate
      - run: pnpm content:sync
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build
      - name: Bundle budget (first-load JS on a production server)
        run: |
          (cd apps/lms && pnpm exec next start --port 3001 > /tmp/lms.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3001/ && break; sleep 1; done
          pnpm check-budget
